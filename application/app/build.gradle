apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.tencent.uikit.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.trtc.uikit.livekit.example"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude '/META-INF/{AL2.0,LGPL2.1}'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':debug')
    implementation project(':tuilivekit')
    api project(':tuiroomkit')
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    api rootProject.ext.imSdk
    api rootProject.ext.atomicxCoreSdk
    api rootProject.ext.liteavSdk
    api rootProject.ext.liteavScreenCaptureSdk

    implementation('com.tencent:mmkv:2.4.2')
    implementation("com.github.bumptech.glide:glide:4.12.0")
    implementation("androidx.core:core:1.13.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation "androidx.navigation:navigation-fragment:2.1.0"
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}