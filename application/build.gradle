buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    liteavSdk = "com.tencent.liteav:LiteAVSDK_Professional:13.5.0.20670"
    liteavScreenCaptureSdk = "com.tencent.liteav:LiteAVSDK_ScreenCapture:13.5.0.20670"
    atomicxCoreSdk = "io.trtc.uikit:atomicx-core:5.3.6.22"
    imSdk = "com.tencent.imsdk:imsdk-plus:9.1.7824"
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.force rootProject.ext.liteavSdk,
                rootProject.ext.liteavScreenCaptureSdk, rootProject.ext.imSdk
    }
}
