buildscript {
    ext.dokka_version = '1.8.20'
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        def gradleMajorVersion = gradle.gradleVersion.tokenize('.')[0].toInteger()
        if (gradleMajorVersion >= 8) {
            classpath 'com.android.tools.build:gradle:8.3.0'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            classpath "org.jetbrains.dokka:dokka-gradle-plugin:$dokka_version"
        } else {
            classpath 'com.android.tools.build:gradle:4.2.1'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.10"
        }
    }
}

plugins {
    id("org.jetbrains.dokka") version "1.8.20" apply false
    alias(libs.plugins.kotlin.android) apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

ext {
    liteavSdk = "com.tencent.liteav:LiteAVSDK_Professional:latest.release"
    liteavScreenCaptureSdk = "com.tencent.liteav:LiteAVSDK_ScreenCapture:latest.release"
    atomicxCoreSdk = buildAtomicxCoreSource.toBoolean() ? project(":atomicxcore") : "io.trtc.uikit:atomicx-core:latest.release"
    imSdk = "com.tencent.imsdk:imsdk-plus:8.7.7201"
}