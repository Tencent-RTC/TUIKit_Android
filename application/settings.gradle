dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        flatDir {
            dirs 'app/libs'
        }
        maven { url 'https://jitpack.io' }
        maven { url "https://mirrors.tencent.com/repository/maven/thirdparty" }
        maven { url "https://mirrors.tencent.com/nexus/repository/maven-public/" }
        maven { url "https://mirrors.tencent.com/nexus/repository/gradle-plugins/" }
        maven { url "https://mirrors.tencent.com/repository/maven/liteavsdk" }
    }
}

include ':app'

include ':debug'

include ':tuilivekit'
project(':tuilivekit').projectDir = file('../live/tuilivekit')

include ':tuiroomkit'
project(':tuiroomkit').projectDir = file("../room/tuiroomkit")

include ':tuicallkit-kt'
project(':tuicallkit-kt').projectDir = file('../call/tuicallkit-kt')

include ':atomic_x'
project(':atomic_x').projectDir = file('../atomic_x')