plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 34
    namespace "com.trtc.uikit.roomkit"

    defaultConfig {
        minSdkVersion 21
        versionName "1.0"
        versionCode 1
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.6.1'
    api 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'

    api 'io.trtc.uikit:atomicx-core:4.3.10.56'
    api 'io.trtc.uikit:rtc_room_engine:4.3.10.56'
    api 'com.google.code.gson:gson:2.8.9'
    api 'com.tencent.liteav:LiteAVSDK_Professional:13.4.0.20477'
    api 'com.tencent.imsdk:imsdk-plus:8.7.7201'
}
